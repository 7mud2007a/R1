<script>
(() => {
 const DATA={
  earth:{name:'EARTH',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',desc:'Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment starts today. Early Bird tickets typically last a week, don’t miss out!'},
  venus:{name:'VENUS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',desc:'Explore the fascinating world of Venus, our neighboring planet wrapped in clouds, heat, and mystery.'},
  mars:{name:'MARS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',desc:'Discover Mars, the red planet, and learn about its landscapes, atmosphere, and place in our solar system.'}
 };
 const order=['earth','venus','mars'];
 const videos=[...document.querySelectorAll('.sky video')], slots=[...document.querySelectorAll('.planet')];
 const title=document.getElementById('title'), lede=document.getElementById('lede'), ll=document.getElementById('label-l'), lr=document.getElementById('label-r'), copy=document.getElementById('copy');
 let active='earth', switching=false;

 function loadVideo(p){
  const v=videos.find(x=>x.dataset.planet===p);
  if(!v) return null;
  if(!v.src && v.dataset.src){v.src=v.dataset.src;v.load()}
  return v;
 }
 function setSlot(slot,p){
  slot.querySelectorAll('img').forEach(img=>img.classList.toggle('is-shown',img.dataset.planet===p));
  slot.dataset.planet=p;
  slot.setAttribute('aria-label','Switch to '+DATA[p].name);
 }
 function render(animate=true){
  const others=order.filter(p=>p!==active);
  setSlot(slots[0],others[0]); setSlot(slots[1],others[1]);
  ll.textContent=DATA[others[0]].name; lr.textContent=DATA[others[1]].name;
  const v=loadVideo(active);
  if(v){
   videos.forEach(x=>{x.classList.toggle('is-active',x===v); if(x!==v) x.pause()});
   v.play().catch(()=>{});
  }
  if(animate){
   copy.classList.add('is-switching');
   setTimeout(()=>{title.textContent=DATA[active].name;lede.textContent=DATA[active].desc;copy.classList.remove('is-switching')},180);
  }else{title.textContent=DATA[active].name;lede.textContent=DATA[active].desc}
 }
 function activate(p){if(switching||p===active)return;switching=true;active=p;render(true);setTimeout(()=>switching=false,430)}
 slots.forEach(slot=>slot.addEventListener('click',()=>activate(slot.dataset.planet)));
 render(false);

 const navrow=document.querySelector('.navrow'), burger=document.querySelector('.burger');
 burger.addEventListener('click',()=>{
  const open=navrow.dataset.open==='true';navrow.dataset.open=String(!open);
  burger.setAttribute('aria-expanded',String(!open));burger.setAttribute('aria-label',open?'Open navigation':'Close navigation');
 });
 document.querySelectorAll('.links a').forEach(a=>a.addEventListener('click',()=>{navrow.dataset.open='false';burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-label','Open navigation')}));
 document.querySelector('.scroll').addEventListener('click',()=>window.scrollTo({top:window.innerHeight,behavior:'smooth'}));
})();
</script>
</body>
</html>
