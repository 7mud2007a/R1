<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Aurora Liquid Nav</title>
    <style>
        /* =========================================
            1. CYBER-AURORA THEME VARIABLES
           ========================================= */
        :root {
            /* Light Theme - Cyber Emerald & Sunlight */
            --bg-color: #f0f4f8;
            --blob-1: #00f2fe;
            --blob-2: #4facfe;
            --blob-3: #00c6ff;
            --blob-opacity: 0.8;
            
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: rgba(0, 120, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --glass-caustic: rgba(0, 242, 254, 0.2);
            --reflection-start: rgba(255, 255, 255, 0.7);
            --reflection-end: rgba(255, 255, 255, 0.0);
            --glare-color: rgba(0, 242, 254, 0.4);
            
            --pill-bg: linear-gradient(135deg, #ffffff 0%, #e2eafc 100%);
            --pill-shadow: 0 8px 20px rgba(0, 100, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            --icon-color: #4a5568;
            --icon-active: #0066ff;
            --divider: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            /* Dark Theme - Aurora Neon / Deep Cyber Space */
            --bg-color: #050508;
            --blob-1: #00ff87;
            --blob-2: #60efff;
            --blob-3: #7b2cbf;
            --blob-opacity: 0.6;
            
            --glass-bg: rgba(18, 18, 26, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.7);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-caustic: rgba(0, 255, 135, 0.08);
            --reflection-start: rgba(255, 255, 255, 0.12);
            --reflection-end: rgba(255, 255, 255, 0.0);
            --glare-color: rgba(96, 239, 255, 0.25);
            
            --pill-bg: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
            --pill-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 0 15px rgba(0,255,135,0.15);
            --icon-color: #8f9ba8;
            --icon-active: #00ff87;
            --divider: rgba(255, 255, 255, 0.1);
        }

        /* =========================================
            2. GLOBAL SETUP & BACKGROUND MESH
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: transparent;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .bg-mesh {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: var(--bg-color);
            transition: background 0.8s ease;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: var(--blob-opacity);
            animation: float 18s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
            will-change: transform;
            transition: background 0.8s ease, opacity 0.8s ease;
        }

        .blob-1 { width: 60vw; height: 60vw; top: -20%; left: -20%; background: var(--blob-1); animation-delay: 0s; }
        .blob-2 { width: 55vw; height: 55vw; bottom: -20%; right: -20%; background: var(--blob-2); animation-delay: -6s; }
        .blob-3 { width: 40vw; height: 40vw; top: 25%; left: 30%; background: var(--blob-3); animation-delay: -12s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(8%, 12%) scale(1.1) rotate(10deg); }
            66% { transform: translate(-6%, 8%) scale(0.9) rotate(-10deg); }
            100% { transform: translate(0, -12%) scale(1.05) rotate(0deg); }
        }

        /* =========================================
            3. NEW NAVBAR STYLE (CYBER-PILL HOUSING)
           ========================================= */
        .liquid-nav {
            position: relative;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 24px; /* Flatter, sharper modern tech style */
            
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            
            box-shadow: 
                0 30px 60px -15px var(--glass-shadow),
                inset 0 1px 2px var(--glass-highlight),
                inset 0 -1px 3px var(--glass-caustic),
                0 0 0 1px var(--glass-border);
                
            transition: all 0.5s ease;
            z-index: 10;
        }

        .liquid-nav::before {
            content: '';
            position: absolute;
            top: 1px; left: 1px; right: 1px; height: 40%;
            border-radius: 23px 23px 12px 12px;
            background: linear-gradient(180deg, var(--reflection-start) 0%, var(--reflection-end) 100%);
            pointer-events: none;
            z-index: 6; 
            transition: background 0.5s ease;
        }

        .liquid-glare-container {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            overflow: hidden;
            pointer-events: none;
            z-index: 5;
        }
        
        .liquid-glare {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(circle 120px at var(--x, 50%) var(--y, 50%), var(--glare-color) 0%, transparent 100%);
            mix-blend-mode: overlay;
        }
        
        .liquid-nav:hover .liquid-glare {
            opacity: 1;
        }

        /* =========================================
            4. NAVIGATION BUTTONS & SLIDER
           ========================================= */
        .nav-items {
            position: relative;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .active-pill {
            position: absolute;
            top: 0; left: 0; 
            height: 44px;
            background: var(--pill-bg);
            border-radius: 16px; /* Matching corner radius */
            box-shadow: var(--pill-shadow);
            
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                        width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.5s ease, box-shadow 0.5s ease;
            z-index: 1; 
        }

        .nav-btn {
            position: relative;
            background: transparent;
            border: none;
            padding: 0 18px;
            height: 44px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: var(--icon-color);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.3s ease;
            outline: none;
            z-index: 2;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .nav-btn:active .btn-content {
            transform: scale(0.92);
        }

        .nav-btn.active {
            color: var(--icon-active);
        }

        /* =========================================
            5. DIVIDER & THEME BUTTON
           ========================================= */
        .divider {
            width: 1px;
            height: 22px;
            background: var(--divider);
            margin: 0 8px;
            z-index: 3;
            transition: background 0.5s ease;
        }

        .theme-btn {
            position: relative;
            background: transparent;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            color: var(--icon-color);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            z-index: 3;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease, background 0.3s ease;
        }

        .theme-btn:hover {
            background: var(--glass-border);
            color: var(--icon-active);
        }

        .theme-icon-wrapper {
            position: relative;
            width: 18px;
            height: 18px;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .theme-btn:active .theme-icon-wrapper {
            transform: scale(0.8);
        }

        .theme-icon-wrapper svg {
            position: absolute;
            top: 0; left: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.4s ease;
            stroke-width: 2.2;
        }

        .sun { opacity: 1; transform: rotate(0deg) scale(1); }
        .moon { opacity: 0; transform: rotate(-90deg) scale(0); }

        [data-theme="dark"] .sun { opacity: 0; transform: rotate(90deg) scale(0); }
        [data-theme="dark"] .moon { opacity: 1; transform: rotate(0deg) scale(1); }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="liquid-nav" id="nav">
        <div class="liquid-glare-container">
            <div class="liquid-glare" id="glare"></div>
        </div>

        <div class="nav-items">
            <div class="active-pill" id="active-pill"></div>

            <button class="nav-btn active">
                <div class="btn-content">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>Explorer</span>
                </div>
            </button>

            <button class="nav-btn">
                <div class="btn-content">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>System</span>
                </div>
            </button>

            <button class="nav-btn">
                <div class="btn-content">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Download</span>
                </div>
            </button>
        </div>

        <div class="divider"></div>

        <button class="theme-btn" id="theme-btn" aria-label="Dark Mode Toggle">
            <div class="theme-icon-wrapper">
                <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </div>
        </button>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const navButtons = document.querySelectorAll(".nav-btn");
            const activePill = document.getElementById("active-pill");
            const themeBtn = document.getElementById("theme-btn");
            const nav = document.getElementById("nav");
            const glare = document.getElementById("glare");

            function updatePill(btn, smooth = true) {
                if (!btn) return;
                
                if (!smooth) {
                    activePill.style.transition = 'none';
                } else {
                    activePill.style.transition = 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), width 0.45s cubic-bezier(0.16, 1, 0.3, 1), background 0.5s ease, box-shadow 0.5s ease';
                }
                
                activePill.style.width = `${btn.offsetWidth}px`;
                activePill.style.transform = `translateX(${btn.offsetLeft}px)`;
            }

            const initialActive = document.querySelector(".nav-btn.active");
            if (initialActive) {
                setTimeout(() => {
                    updatePill(initialActive, false);
                    void activePill.offsetWidth; 
                }, 50);
            }

            navButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    navButtons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    updatePill(btn);
                });
            });

            themeBtn.addEventListener("click", () => {
                const root = document.documentElement;
                const isDark = root.getAttribute("data-theme") === "dark";
                root.setAttribute("data-theme", isDark ? "light" : "dark");
                
                setTimeout(() => {
                    const active = document.querySelector(".nav-btn.active");
                    if (active) updatePill(active);
                }, 100);
            });

            window.addEventListener("resize", () => {
                const active = document.querySelector(".nav-btn.active");
                if (active) updatePill(active, false);
            });

            nav.addEventListener("mousemove", (e) => {
                const rect = nav.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                glare.style.setProperty("--x", `${x}px`);
                glare.style.setProperty("--y", `${y}px`);
            });
        });
    </script>
</body>
</html>
